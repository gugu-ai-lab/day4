<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>제주 감귤 대탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1b3d; touch-action: none; user-select: none; -webkit-user-select: none;
               font-family: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  html, body { width: 100%; height: 100dvh; position: fixed; inset: 0; }
  canvas { display: block; position: fixed; inset: 0; }
  .side { position: fixed; top: 132px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .side button, .side a { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.25);
                          color: #fff; font-size: 20px; display: grid; place-items: center; text-decoration: none; cursor: pointer;
                          backdrop-filter: blur(4px); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .pad { position: fixed; bottom: 18px; z-index: 5; display: none; gap: 12px; }
  .pad.l { left: 16px; } .pad.r { right: 16px; }
  .pad button { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; color: #fff; font-size: 30px; font-family: inherit;
                background: rgba(255,140,60,.55); box-shadow: 0 6px 16px rgba(0,0,0,.3); touch-action: none; }
  .pad button.big { width: 96px; height: 96px; background: rgba(255,90,120,.6); font-size: 22px; }
  .pad button:active { transform: scale(.92); filter: brightness(1.2); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="side">
  <button id="mute" title="소리 (M)">🔊</button>
  <a href="index.html" title="처음으로">🏠</a>
</div>
<div class="pad l"><button id="bl">◀</button><button id="br">▶</button></div>
<div class="pad r"><button id="bb">⏩</button><button id="bj" class="big">점프</button></div>
<script src="mikan.js"></script>
</body>
</html>
